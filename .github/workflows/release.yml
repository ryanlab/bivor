name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Pre-create the draft release so the parallel matrix jobs below all find
  # it and only upload assets. Without this, electron-builder's non-atomic
  # find-or-create logic races and produces duplicate draft releases.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release for tag
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --title "${GITHUB_REF_NAME#v}" --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-mac:
    needs: create-release
    strategy:
      matrix:
        include:
          # macos-latest is Apple Silicon; macos-15-intel is the last x86_64
          # runner GitHub offers (available until August 2027)
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild native modules for Electron
        run: pnpm exec electron-rebuild -f -w node-pty

      - name: Build
        run: pnpm build

      - name: Package and publish to GitHub Releases
        run: pnpm exec electron-builder --mac --${{ matrix.arch }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild native modules for Electron
        run: pnpm exec electron-rebuild -f -w node-pty

      - name: Build
        run: pnpm build

      - name: Package and publish to GitHub Releases
        run: pnpm exec electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
